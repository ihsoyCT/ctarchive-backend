# Rate limit zones for ihsoy.com, installed as /etc/nginx/conf.d/ihsoy-ratelimit.conf
# (http context). Used by the locations in ihsoy.com.conf. $binary_remote_addr is
# the real visitor address because conf.d/cloudflare.conf sets real_ip.
#
# Measured on 2026-09-26 without the crawler: 99.9% of visitors stay at or below
# 12 /api and 6 /reddit-comments requests per minute; the busiest minute was 43
# /api requests. Rejections are logged to error.log, where fail2ban picks them up.

limit_req_zone $binary_remote_addr zone=ihsoy_api:10m      rate=60r/m;
limit_req_zone $binary_remote_addr zone=ihsoy_comments:10m rate=12r/m;
limit_req_status 429;
