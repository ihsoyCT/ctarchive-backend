# Ban by adding "deny <ip>;" to an nginx include file and reloading nginx.
# A firewall ban would not work here: visitors reach the server through
# Cloudflare, so their own address never connects directly.
#
# The file is emptied when the jail starts; fail2ban then re-applies the bans
# still stored in its database, so the file never keeps stale entries.

[Definition]

actionstart = printf '# Managed by fail2ban (action nginx-deny), do not edit\n' > <blockfile>
              <reload>

actionstop = printf '# Managed by fail2ban (action nginx-deny), do not edit\n' > <blockfile>
             <reload>

actioncheck =

actionban = grep -qxF 'deny <ip>;' <blockfile> || echo 'deny <ip>;' >> <blockfile>
            <reload>

actionunban = grep -vxF 'deny <ip>;' <blockfile> > <blockfile>.tmp; cat <blockfile>.tmp > <blockfile>; rm -f <blockfile>.tmp
              <reload>

reload = nginx -t -q && systemctl reload nginx

[Init]

blockfile = /etc/nginx/blocklist-auto.conf
