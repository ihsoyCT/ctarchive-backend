# Ban clients that keep hitting the nginx rate limits for ihsoy.com.
# Normal visitors never reach the limits (see nginx/ihsoy-ratelimit.conf), so
# 30 rejected requests within 10 minutes means a scraper.

[ihsoy-limit-req]
enabled  = true
filter   = nginx-limit-req
backend  = polling
logpath  = /var/log/nginx/error.log
port     = http,https
action   = nginx-deny
maxretry = 30
findtime = 10m
bantime  = 1h
# Repeat offenders get doubled bans, up to a week
bantime.increment = true
bantime.maxtime   = 1w
ignoreip = 127.0.0.1/8 ::1
